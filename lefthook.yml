pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,mjs,cjs,ts,tsx,json,jsonc,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: bunx --bun commitlint --edit {1}
    - name: dco
      run: bun scripts/check-dco.ts --message-file {1}

name: Feature request
description: Suggest an idea or an improvement.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true

name: Docs

# Builds the docs site and publishes it on Cloudflare Workers. A merge to main deploys it; a pull
# request from this repository gets a preview, linked from the pull request as a deployment.
# Pull requests from forks get no preview: GitHub doesn't give them the Cloudflare token.
# Not a required check, because it only runs when the docs can change.
on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/api-client/openapi.json
      - packages/shared/**
      - package.json
      - bun.lock
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - apps/docs/**
      - packages/api-client/openapi.json
      - packages/shared/**
      - package.json
      - bun.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, so a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: 1
  TURBO_TELEMETRY_DISABLED: 1
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docs
      url: https://opentrail.mraeron.tech
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter=@repo/docs
      - name: Deploy
        working-directory: apps/docs
        run: bun --bun wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: docs-preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx turbo run build --filter=@repo/docs
      - name: Upload a preview
        id: upload
        working-directory: apps/docs
        # A new version with a stable alias per pull request; production stays untouched.
        run: |
          bun --bun wrangler versions upload --preview-alias "pr-$PR_NUMBER" | tee upload.log
          url="$(grep -o "https://pr-$PR_NUMBER-[a-z0-9.-]*\.workers\.dev" upload.log | head -1)"
          if [ -z "$url" ]; then
            echo "::error::The upload printed no preview URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

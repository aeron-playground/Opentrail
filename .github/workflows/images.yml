name: Images

# Docker images of the API and the indexer. Pull requests that can change them build and
# smoke-test them. A published GitHub Release pushes them to ghcr.io under the release version;
# a manual run on main pushes them as "edge". Every pushed image gets a signed build provenance
# attestation. Not a required check, because it only runs when the images can change.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/api/**
      - apps/indexer/**
      - packages/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/images.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, so a failing command inside a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: 1

jobs:
  test:
    name: test (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            port: 3001
            health: /v1/health
          - app: indexer
            port: 3002
            health: /health
    env:
      APP: ${{ matrix.app }}
      PORT: ${{ matrix.port }}
      HEALTH: ${{ matrix.health }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --file "apps/$APP/Dockerfile" --tag "$APP:test" .
      - name: Check that it runs as a non-root user
        run: |
          user="$(docker inspect --format '{{.Config.User}}' "$APP:test")"
          if [ "$user" != "65532:65532" ]; then
            echo "::error::The image runs as '$user', not as the unprivileged user 65532."
            exit 1
          fi
      - name: Check that no settings files or tests are inside
        run: |
          container="$(docker create "$APP:test")"
          docker export "$container" | tar -t > files.txt
          docker rm "$container" > /dev/null
          if grep -v '/node_modules/' files.txt | grep -E '(^|/)\.env|\.test\.ts$'; then
            echo "::error::The image contains the files listed above. Check .dockerignore."
            exit 1
          fi
      - name: Check that it starts and answers
        # There's no database here, so a healthy image answers its health check with 503 "down".
        run: |
          docker run --detach --name smoke --publish "$PORT:$PORT" \
            --env DATABASE_URL=postgres://smoke:smoke@127.0.0.1:1/smoke \
            --env HELIUS_WEBHOOK_SECRET=smoke-test-secret-that-is-long-enough \
            "$APP:test"
          status=000
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output body.json --write-out '%{http_code}' "http://127.0.0.1:$PORT$HEALTH" || true)"
            if [ "$status" != "000" ]; then
              break
            fi
            sleep 1
          done
          if [ "$status" != "503" ] || ! grep -q '"database":"down"' body.json; then
            echo "::error::Expected 503 with the database down, got $status."
            cat body.json || true
            docker logs smoke
            exit 1
          fi

  publish:
    needs: test
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, indexer]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      APP: ${{ matrix.app }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/opentrail-${{ matrix.app }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the tag
        id: tag
        # A release "v0.0.2" becomes the tag "0.0.2"; a manual run becomes "edge".
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to ghcr.io
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: push
        # The docker-container builder can attach a software bill of materials (SBOM) and
        # BuildKit provenance to the pushed image.
        run: |
          docker buildx create --use --driver docker-container > /dev/null
          docker buildx build \
            --file "apps/$APP/Dockerfile" \
            --platform linux/amd64 \
            --tag "$IMAGE:$TAG" \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-only" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-only" \
            --sbom=true \
            --provenance=mode=min \
            --metadata-file metadata.json \
            --push \
            .
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

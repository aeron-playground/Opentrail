services:
  postgres:
    # Keep in sync with the service image in .github/workflows/ci.yml.
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Local machine only: other devices on the network can't reach this database.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>, so mount the parent.
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
